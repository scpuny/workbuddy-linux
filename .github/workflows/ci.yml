# CI — validate scripts, packaging metadata, and PR sanity
name: CI

on:
  push:
    branches: [main, master, develop, dev]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - LICENSE
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on all shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          ignore: node_modules
          severity: warning

  syntax-check:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax
        run: |
          set -e
          echo "::group::install.sh"
          bash -n install.sh
          echo "::endgroup::"
          for f in scripts/*.sh scripts/lib/*.sh; do
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done
          echo "All scripts pass syntax check."

  packaging-validate:
    name: Packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate control file
        run: |
          set -e
          echo "::group::control file"
          sed \
            -e "s/__PACKAGE_NAME__/workbuddy/g" \
            -e "s/__VERSION__/0.0.0/g" \
            -e "s/__ARCH__/amd64/g" \
            packaging/linux/control > /tmp/control-check
          # Basic field validation
          for field in Package Version Section Priority Architecture Depends Maintainer Description; do
            grep -q "^${field}:" /tmp/control-check || { echo "Missing field: $field"; exit 1; }
          done
          echo "Control file is valid."
          echo "::endgroup::"
      - name: Validate .desktop file
        run: |
          set -e
          echo "::group::desktop file"
          desktop-file-validate packaging/linux/workbuddy.desktop || true
          echo "::endgroup::"

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json version matches README badges
        run: |
          set -e
          PKG_VER=$(node -e "console.log(require('./package.json').version)")
          echo "Package version: $PKG_VER"
          if grep -q "版本适配.*${PKG_VER}" README.md; then
            echo "README version badge matches package.json"
          else
            echo "⚠️  README version badge might need update (expected $PKG_VER)"
          fi

  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    env:
      DMG_URL: ${{ secrets.DMG_DOWNLOAD_URL }}
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron
      ELECTRON_HEADERS_URL: https://npmmirror.com/mirrors/electron
      WORKBUDDY_INSTALL_DIR: ${{ github.workspace }}/workbuddy-app
      APP_DIR: ${{ github.workspace }}/workbuddy-app
      WORKBUDDY_ELECTRON_CACHE_DIR: ${{ github.workspace }}/.cache/electron
      DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - name: Check DMG secret
        run: |
          if [ -z "$DMG_URL" ]; then
            echo "⚠️  DMG_DOWNLOAD_URL secret not set — skipping build"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq             bash ca-certificates curl unzip 7zip python3 make g++ pkg-config             libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev             dpkg-dev fakeroot desktop-file-utils             nodejs npm

      - name: Verify Node.js
        run: |
          echo "node $(node -v) / npm $(npm -v) / npx $(npx -v)"

      - name: Download official WorkBuddy DMG
        run: |
          mkdir -p downloads
          echo "Downloading DMG from $DMG_URL ..."
          curl -L --fail --progress-bar -o downloads/workbuddy.dmg "$DMG_URL"
          ls -lh downloads/workbuddy.dmg

      - name: Build Linux app (install.sh)
        run: |
          bash install.sh downloads/workbuddy.dmg 2>&1

      - name: Build .deb package
        run: |
          bash scripts/build-deb.sh 2>&1

      - name: List artifacts
        run: |
          echo "=== dist/ contents ==="
          ls -lhR dist/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: workbuddy-deb
          path: /tmp/release-artifacts

      - name: Generate checksums
        run: |
          cd /tmp/release-artifacts
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          DEB_NAME="$(ls /tmp/release-artifacts/*.deb | head -1 | xargs basename)"
          DEB_SIZE="$(du -h /tmp/release-artifacts/*.deb | cut -f1)"
          cat > /tmp/release-notes.md <<EOF
          ## WorkBuddy Linux v${{ github.ref_name }}

          **Unofficial Linux port** — .deb package for Debian/Ubuntu/Linux Mint.

          ### 📦 Downloads

          | File | Size |
          |------|------|
          | \`${DEB_NAME}\` | ${DEB_SIZE} |

          ### 🚀 Install

          \`\`\`bash
          sudo dpkg -i ${DEB_NAME}
          sudo apt-get install -f
          workbuddy
          \`\`\`

          Built from commit \`${{ github.sha }}\`.
          EOF
          echo "notes_path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG"             --title "WorkBuddy Linux ${TAG}"             --notes-file "${{ steps.notes.outputs.notes_path }}"             /tmp/release-artifacts/*.deb             /tmp/release-artifacts/SHA256SUMS
