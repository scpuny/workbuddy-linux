# Release workflow — DEPRECATED
#
# Release builds have moved to ci.yml.
# Push a tag and the CI workflow will build and publish automatically.
#
# Trigger: push a version tag (e.g. v5.2.5)
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  redirect:
    name: Release via CI
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "╔═══════════════════════════════════════════════════╗"
          echo "║  Release builds have moved to .github/workflows/ci.yml     ║"
          echo "║                                                   ║"
          echo "║  Push a tag and the CI workflow will:             ║"
          echo "║  1. Build the .deb package                        ║"
          echo "║  2. Publish it as a GitHub Release                ║"
          echo "╚═══════════════════════════════════════════════════╝"
          echo ""
          echo "See: https://github.com/${{ github.repository }}/actions/workflows/ci.yml"
