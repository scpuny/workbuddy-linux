# Release workflow
#
# Triggered by pushing a tag matching v<semver>, e.g. v4.22.10.
# Packages the conversion tooling (scripts, patches, packaging metadata)
# and creates a GitHub Release. **No upstream DMG or converted app
# binary is included** — the project respects the "no redistribution"
# policy. End-users must provide their own official DMG and run the
# scripts locally.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json
        id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"        # strip leading v
          PKG="$(node -e 'console.log(require("./package.json").version)')"
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "✅ Tag v$TAG matches package.json"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check that README badges reflect this version
        run: |
          VER="${{ steps.check.outputs.version }}"
          if grep -q "版本适配.*${VER}" README.md; then
            echo "README badge OK"
          else
            echo "⚠️  README version badges may need an update"
          fi

  build-tooling:
    name: Package tooling
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Create tooling archive
        run: |
          set -e
          VER="${{ needs.validate.outputs.version }}"
          ARCHIVE="workbuddy-linux-tooling-${VER}.tar.gz"

          # Only include the conversion tooling — no DMGs, no build artifacts
          tar czf "/tmp/${ARCHIVE}" \
            install.sh \
            scripts/ \
            packaging/ \
            package.json \
            Makefile \
            README.md \
            LICENSE \
            --exclude='scripts/lib/*.swp' \
            --exclude='scripts/lib/*.swo' \
            --exclude='*~' \
            --exclude='node_modules'

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "path=/tmp/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "/tmp/${ARCHIVE}"

      - name: Generate checksums
        run: |
          VER="${{ needs.validate.outputs.version }}"
          cd /tmp
          sha256sum "workbuddy-linux-tooling-${VER}.tar.gz" > "workbuddy-linux-tooling-${VER}.tar.gz.sha256"
          echo "checksum_path=/tmp/workbuddy-linux-tooling-${VER}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

    outputs:
      archive_name: ${{ steps.create-archive.outputs.archive }}
      archive_path: ${{ steps.create-archive.outputs.path }}
      checksum_path: ${{ steps.generate-checksums.outputs.checksum_path }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-tooling]
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        id: notes
        run: |
          VER="${{ needs.validate.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## WorkBuddy Linux Tooling v${VER}

          Conversion scripts and Linux runtime patches for WorkBuddy **v${VER}**.

          ### ⚠️ Important

          This release contains **only the conversion tooling** — no upstream
          WorkBuddy binary is included. To build the Linux app you need:

          1. The official WorkBuddy **Intel/x64 DMG** for macOS (download from
             the official website)
          2. Place it in \`downloads/\` (one DMG only)
          3. Run \`make deps && make build-app && make package && make install\`

          ### 📦 What's in this archive

          - \`install.sh\` — DMG extraction, Electron runtime download, native module rebuild
          - \`scripts/\` — package builders (deb/rpm/pacman), dependency installer, patches
          - \`packaging/\` — Debian control file, .desktop entry
          - \`Makefile\` — top-level build orchestration
          - \`README.md\` — full documentation (English / 简体中文 / 繁體中文)

          ### ✅ What's changed

          Refer to the [commit log](${{ github.server_url }}/${{ github.repository }}/commits/v${VER})
          for detailed changes.
          EOF
          echo "notes_path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.validate.outputs.version }}"
          gh release create "v${VER}" \
            --title "WorkBuddy Linux Tooling v${VER}" \
            --notes-file "${{ steps.notes.outputs.notes_path }}" \
            "${{ needs.build-tooling.outputs.archive_path }}" \
            "${{ needs.build-tooling.outputs.checksum_path }}"
